# XyItems v1.0.4 global configuration.
# Item definitions are loaded recursively from plugins/XyItems/items/**/*.yml.

settings:
  # Provider id registered in XyCore. Other XY plugins can create items as xyitems:<item-id>.
  provider-id: 'xyitems'

messages:
  # Message bodies below are automatically prefixed with XyCore's messages.prefix.
  no-permission: '&c你没有权限执行此操作。'
  players-only: '&c该命令只能由玩家执行。'
  player-not-found: '&c玩家 &f{player} &c不在线。'
  item-not-found: '&c未找到物品 ID: &f{item}&c。'
  invalid-amount: '&c数量必须是大于 0 的整数。'
  inventory-full: '&c您的背包已满无法容纳多余物品。'
  item-given: '&a已给予 &f{player} &ax{amount} &f{item}&a。'
  item-received: '&a获得了 &fx{amount} &f{item}&a。'
  identified: '&a鉴定成功: &f{item}'
  reloaded: '&aXyItems 已重载，共加载 &f{count} &a个物品定义。'
  reload-failed: '&c重载失败，已保留当前正在使用的物品配置。'
  no-items: '&e当前没有已加载的物品定义。'
  help:
    - '&bXyItems &7v1.0.4'
    - '&e/xyitem get <物品ID> [数量] &7获得物品'
    - '&e/xyitems list &7查看已加载物品'
    - '&e/xyitems give <玩家> <物品ID> [数量] &7给予物品'
    - '&e/xyitems info <物品ID> &7查看物品来源和状态'
    - '&e/xyitems reload &7重载物品配置'
