# 赤牙墨魄示例
# 首次启动后会复制到 plugins/XyItems/items/Example/Chiyamopo.yml。
# 这是一件“先净化、后随机品质和属性”的示例物品。

items:
  chiyamopo:
    # 1.12.2 Bukkit Material。这里使用萤石粉作为未净化模板。
    material: GLOWSTONE_DUST
    data: 0

    # 未净化状态。此时不会写入攻击力、生命力等属性，避免被 AP 误读。
    display-name: '&f未净化的赤牙墨魄'
    lore:
      - '&7右键<identify.action>后获得随机墨魄'

    identify:
      enabled: true

      # 每件物品可以自定义操作名称：鉴定、净化、拯救、重构等。
      # 该名称可在 Lore 中使用 <identify.action>，成功提示也会使用 {action}。
      action-name: '净化'

      # 强度只比较当前品质内部的属性范围，不跨品质比较。
      # 所有属性都取到当前品质 max 时为 100.0%。
      strength:
        enabled: true
        # 条码总长度。百分比和条码会同时显示。
        bar-length: 10
        # 已达到的格子与未达到的格子，可以换成任意字符和颜色代码。
        filled: '&c'
        empty: '&7'
        percent-format: '0.0'
        # damage 与 health 各占一半；未列出的属性默认权重为 1。
        # 如果某个属性不参与强度，写成 0 即可。
        weights:
          damage: 1
          health: 1

      # 公共成品模板。品质节点只配置权重、名称、颜色和属性范围。
      display-name: '<品质.颜色>赤牙墨魄'
      lore:
        - '&7类型: &f墨魄'
        - '&7品质: <品质.颜色><品质.名称>'
        - '&7强度: &f<strength.percent>%'
        - '&7强度条: <strength.bar>'
        - '&7------------[ &a属性&7 ]--------------'
        - '&7靐攻击力: &c+<damage>'
        - '&7龘生命力: &a+<health>'
        - '&7------------[ &e描述&7 ]--------------'
        - '&7讞我的牙可不是木头做的'
        - '&7----------------------------------'

      # 品质 weight 是相对权重，不是必须凑成100的百分比。
      qualities:
        白描:
          weight: 30
          color: '&7'
          attributes:
            damage: { min: 2, max: 4, format: '0' }
            health: { min: 8, max: 14, format: '0' }

        萌黄:
          weight: 23
          color: '&a'
          attributes:
            damage: { min: 4, max: 6, format: '0' }
            health: { min: 15, max: 24, format: '0' }

        气象:
          weight: 20
          color: '&b'
          attributes:
            damage: { min: 6, max: 9, format: '0' }
            health: { min: 25, max: 38, format: '0' }

        归元:
          weight: 12
          color: '&d'
          attributes:
            damage: { min: 9, max: 13, format: '0' }
            health: { min: 40, max: 58, format: '0' }

        传神:
          weight: 10
          color: '&6'
          attributes:
            damage: { min: 13, max: 18, format: '0' }
            health: { min: 60, max: 85, format: '0' }

        浮世:
          weight: 5
          color: '&c'
          attributes:
            damage: { min: 18, max: 25, format: '0' }
            health: { min: 90, max: 130, format: '0' }
