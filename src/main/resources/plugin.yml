name: XyItems
version: '1.0.2'
main: org.xyplugin.xyitems.XyItemsPlugin
api-version: '1.12'
author: XyPlugins
description: Config-driven XY item library and identification base.
depend: [XyCore]

commands:
  xyitems:
    description: XyItems main command
    usage: /xyitems <get|give|reload|list|info|help>
    aliases: [xyitem, xyi]

permissions:
  xyitems.use:
    description: Allows access to XyItems help and item identification.
    default: true
  xyitems.list:
    description: Allows listing registered XyItems definitions.
    default: op
  xyitems.give:
    description: Allows giving XyItems items.
    default: op
  xyitems.get:
    description: Allows players to obtain configured XyItems items for themselves.
    default: op
  xyitems.reload:
    description: Allows reloading XyItems configurations.
    default: op
